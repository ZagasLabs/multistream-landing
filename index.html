<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050506">
    <meta
      name="description"
      content="Elige dónde ver a Zagas en directo: Twitch o Kick."
    >
    <title>Zagas Live — Elige tu señal</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="signal-noise" data-decoration aria-hidden="true"></div>
    <div class="frame frame--top" data-decoration aria-hidden="true"></div>
    <div class="frame frame--bottom" data-decoration aria-hidden="true"></div>

    <main class="landing">
      <header class="brand" aria-label="Zagas Live">
        <span class="brand__name">ZAGAS</span>
        <span class="brand__live">
          LIVE
          <span class="brand__sparks" aria-hidden="true">
            <i class="brand__spark"></i>
            <i class="brand__spark"></i>
            <i class="brand__spark"></i>
            <i class="brand__spark"></i>
          </span>
        </span>
      </header>

      <p class="prompt">ELIGE TU SEÑAL</p>

      <nav class="platform-links" aria-label="Plataformas de streaming">
        <a class="platform-link platform-link--twitch" href="https://twitch.zagas.id">
          <span>TWITCH</span>
        </a>
        <a class="platform-link platform-link--kick" href="https://kick.zagas.id">
          <span>KICK</span>
        </a>
      </nav>
    </main>
  </body>
</html>
